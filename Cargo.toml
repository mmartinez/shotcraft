[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmartinez/shotcraft"
rust-version = "1.95"
# Distributed as an app, not on crates.io (the UI crate embeds the icon from assets/).
publish = false

[workspace.dependencies]
# internal
shotcraft-doc = { path = "crates/doc" }
shotcraft-engine = { path = "crates/engine" }
shotcraft-ui-egui = { path = "crates/ui-egui" }

# external
anyhow = "1"
arboard = "3.7"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
ecolor = { version = "0.36", features = ["serde"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.36", features = ["serde"] }
egui-phosphor = "0.14"
emath = { version = "0.36", features = ["serde"] }
enigo = "0.6"
epaint_default_fonts = "0.36"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ocrs = "0.13"
raw-window-handle = "0.6"
rfd = "0.17"
# Already in the tree through rustls; used for SHA-256 of the OCR models.
ring = "0.17"
rqrr = "0.11"
# ocrs disables rten's default features; the published ocrs models are ONNX files.
rten = { version = "0.26", default-features = false, features = ["onnx_format"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.48"
thiserror = "2"
tiny-skia = "0.12"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
ureq = "3"
winit = "0.30"
xcap = "0.9"
# platform-specific
drag = "2"
embed-manifest = "1.5"
x11rb = "0.14"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Image processing, OCR inference and PNG encoding are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
