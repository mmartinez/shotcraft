# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). package.sh stages the file tree,
# substitutes its path for ${STAGE} (nfpm does not expand variables in `src`) and sets VERSION
# and PKG_ARCH.
name: shotcraft
arch: ${PKG_ARCH}
platform: linux
version: ${VERSION}
# 0.1.0-beta.1 becomes 0.1.0~beta.1, so pre-releases sort before the release.
version_schema: semver
release: 1
section: graphics
priority: optional
maintainer: The ShotCraft contributors <2624124+mmartinez@users.noreply.github.com>
homepage: https://github.com/mmartinez/shotcraft
license: MIT OR Apache-2.0
description: |-
  Capture, annotate, redact and share screenshots.
  Area, window, fullscreen and scrolling capture, an annotation editor, text recognition,
  pinned screenshots and a capture history, from a tray icon and global shortcuts.

# The binary links glibc, libgcc_s, libxcb and libgbm directly. winit and the OpenGL renderer load
# the rest with dlopen, so they are not ELF NEEDED entries and must be listed here: on X11, libX11,
# libX11-xcb, libXcursor, libXi, libxkbcommon(-x11) and libGL (GLX) or libEGL. Wayland sessions also
# need the Wayland client libraries; X11 is the tested session type, so those are recommended.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libgbm1
      - libxcb1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libgl1 | libegl1
    recommends:
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libegl1
      - xdg-desktop-portal
  rpm:
    # Soname requirements, so the same package resolves on Fedora, RHEL and openSUSE.
    depends:
      - libgbm.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - (libGL.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/shotcraft
    dst: /usr/bin/shotcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree
